name: tests

# Step set must stay identical to ops/ci_check.sh (the local replica of this file).
# Coverage steps only report; they never fail the build (no thresholds yet).
# ruff / mypy come from ops/requirements.txt and are real gates here; the local
# script probes for them (an older build venv may predate them) and prints SKIP.

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r ops/requirements.txt pytest pytest-cov
      - run: python -m ruff check src ops tests
      - run: python -m mypy src
      - run: python -m pytest -q --cov=src --cov-report=term-missing
      - run: python ops/check_config_contract.py
      - run: python ops/check_requirements_lock.py --check
      - run: python ops/check_security_headers.py
      - run: python ops/check_license_headers.py
      - run: python ops/readme_facts.py --check

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: bash ops/migrate_d1.sh --dry-run
      - run: npm test
      - run: npm run test:coverage
