# image-watermark Worker: routing only, no image processing (image.limooo.cn).
#
# Deploy: bash ops/workers_deploy.sh --worker=image-watermark
#         (= wrangler deploy --config ops/image-watermark/wrangler.toml)
#
# Route: image.limooo.cn/* -> image-watermark. The route is deliberately NOT
# declared here: the custom domain and its route live in the Cloudflare Dashboard
# (Workers & Pages -> image-watermark -> Settings -> Domains & Routes) and are only
# documented in ops/cloudflare/README.md. Adding a `routes` block would let every
# deploy rewrite the live route set, which this repository cannot diff or roll back.
name = "image-watermark"
main = "src/index.js"
compatibility_date = "2026-08-15"
account_id = "4a7fd8c8f1a59a265981a73e631b9e3f"

# Watermark variants are produced at build time (src/build.py -> public/static/wm/);
# the Worker only normalises paths and proxies, so CPU cost is near zero and it fits
# the Workers Free 10 ms CPU limit (no runtime Canvas / image re-encoding possible).
