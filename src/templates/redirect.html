{# Limooo - 统一跳转页（redirect.limooo.cn）
   由 build.py 按 4 种语言预渲染为 public/<lang>/redirect.html。
   to / preload / preload_links 由 Pages 中间件在运行时注入。 #}
<!DOCTYPE html>
<html lang="{{ g.lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="/static/icons/Limooo.svg?v=2" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icons/Limooo.svg?v=2">
<link rel="stylesheet" href="/static/fonts-round75.css?v=2">
<script src="/static/js/theme-preload.js?v=2"></script>
<title>{{ _('redirect_title') }}</title>
{{ preload_links|safe }}
<link rel="stylesheet" href="/static/css/tokens.css?v=1">
<link rel="stylesheet" href="/static/css/redirect.css?v=9">
<!-- 站点基础样式：页脚 .global-footer 等结构样式复用主站 base.css -->
<link rel="stylesheet" href="/static/css/base.css?v=18">
</head>
<body data-lang="{{ g.lang }}" data-to="{{ to }}" data-preload='{{ preload_placeholder }}'>
    <div class="card">
        <div class="spinner"></div>
        <div class="text">{{ _('redirect_text') }}</div>
        <noscript><a class="manual-link" href="{{ to }}">{{ _('redirect_text') }}</a></noscript>
    </div>
    {% include "_footer.html" %}
    <script src="/static/js/redirect.js?v=2" defer></script>
</body>
</html>
