<!DOCTYPE html>
<html lang="{{ g.lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Limooo 页面预览</title>

<link rel="stylesheet" href="../static/css/preview.css">
</head>
<body>
    <h1>Limooo 页面预览</h1>
    <p class="desc">所有子域页面（单语言），点击在本地浏览器中预览（图片/导航均为本地文件）。</p>
    <ul>{% for page in pages %}<li><a href="{{ page }}" target="_blank" rel="noopener">{{ page.replace('.html', '') }}</a></li>{% endfor %}</ul>
</body>
</html>
